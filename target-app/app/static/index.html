<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AcmeBot Support</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; }
    #app { max-width: 720px; margin: 2rem auto; background: #fff; border-radius: 12px;
           box-shadow: 0 2px 10px rgba(0,0,0,.08); display: flex; flex-direction: column; height: 80vh; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #e5e7eb; font-weight: 600;
             display: flex; justify-content: space-between; align-items: center; }
    #protection { font-size: .8rem; font-weight: 500; padding: .2rem .6rem; border-radius: 999px; background: #e5e7eb; }
    #protection.on { background: #dcfce7; color: #166534; }
    #protection.off { background: #fee2e2; color: #991b1b; }
    #messages { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }
    .msg { margin: .5rem 0; padding: .6rem .9rem; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
    .user { background: #2563eb; color: #fff; margin-left: auto; }
    .bot { background: #eef0f3; }
    .blocked { background: #fee2e2; color: #7f1d1d; }
    .reason { display: block; font-size: .8rem; margin-top: .3rem; opacity: .8; }
    #typing { color: #6b7280; font-size: .9rem; padding: 0 1.25rem .5rem; }
    form { display: flex; gap: .5rem; padding: .75rem 1.25rem; border-top: 1px solid #e5e7eb; }
    #input { flex: 1; padding: .6rem .8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    #send { padding: .6rem 1.1rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    #send:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span>AcmeBot &middot; AcmeBank Support</span>
      <span id="protection" data-testid="protection-badge">checking...</span>
    </header>
    <div id="messages" data-testid="messages"></div>
    <div id="typing" data-testid="typing" hidden>AcmeBot is typing...</div>
    <form id="chat-form">
      <input id="input" data-testid="chat-input" autocomplete="off" placeholder="Ask about your account..." />
      <button id="send" data-testid="send-button" type="submit">Send</button>
    </form>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const typing = document.getElementById("typing");

    // SECURITY: text is always inserted with textContent, never innerHTML,
    // so a reply containing <script> or <img onerror=...> is shown as plain
    // text and never executed (this is what the Selenium XSS test checks).
    function addMessage(text, cls, reason) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.setAttribute("data-testid", cls.split(" ").pop() + "-message");
      div.textContent = text;
      if (reason) {
        const small = document.createElement("span");
        small.className = "reason";
        small.setAttribute("data-testid", "block-reason");
        small.textContent = "Blocked: " + reason;
        div.appendChild(small);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // Header badge: shows whether all security layers are switched on.
    fetch("/health").then(r => r.json()).then(h => {
      const p = h.protection;
      const allOn = p.input_rules && p.ml_guardrail && p.output_rules;
      const badge = document.getElementById("protection");
      badge.textContent = (allOn ? "Protection ON" : "Protection OFF") + " · " + h.version;
      badge.className = allOn ? "on" : "off";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;                       // empty messages are not sent
      addMessage(text, "user");
      input.value = "";
      send.disabled = true;
      typing.hidden = false;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data.blocked) addMessage(data.reply, "bot blocked", data.reason);
        else addMessage(data.reply, "bot");
      } catch (err) {
        addMessage("Error: " + err.message, "bot error");
      } finally {
        typing.hidden = true;
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
