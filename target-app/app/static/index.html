<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AcmeBot Support</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; }
    #app { max-width: 720px; margin: 2rem auto; background: #fff; border-radius: 12px;
           box-shadow: 0 2px 10px rgba(0,0,0,.08); display: flex; flex-direction: column; height: 80vh; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
    #messages { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }
    .msg { margin: .5rem 0; padding: .6rem .9rem; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
    .user { background: #2563eb; color: #fff; margin-left: auto; }
    .bot { background: #eef0f3; }
    .blocked { background: #fee2e2; }
    form { display: flex; gap: .5rem; padding: .75rem 1.25rem; border-top: 1px solid #e5e7eb; }
    #input { flex: 1; padding: .6rem .8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    #send { padding: .6rem 1.1rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    #send:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div id="app">
    <header>AcmeBot &middot; AcmeBank Support</header>
    <div id="messages" data-testid="messages"></div>
    <form id="chat-form">
      <input id="input" data-testid="chat-input" autocomplete="off" placeholder="Ask about your account..." />
      <button id="send" data-testid="send-button" type="submit">Send</button>
    </form>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function addMessage(html, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      // INTENTIONAL VULNERABILITY (v1): bot replies are inserted as raw HTML,
      // so model output containing <script>/<img onerror> is executed (XSS).
      // The Selenium suite detects this; the hardened version uses textContent.
      if (cls.includes("bot")) { div.innerHTML = html; } else { div.textContent = html; }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      send.disabled = true;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        addMessage(data.reply, "bot" + (data.blocked ? " blocked" : ""));
      } catch (err) {
        addMessage("Error: " + err.message, "bot blocked");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
