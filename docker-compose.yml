services:
  # ML prompt-injection guardrail: trained and quality-gated during the image build.
  guardrail:
    build:
      context: .
      dockerfile: guardrail/Dockerfile
    container_name: acme-guardrail
    ports:
      - "8001:8001"

  chatbot:
    build: ./target-app
    container_name: acmebot
    ports:
      - "8000:8000"
    depends_on:
      guardrail:
        condition: service_healthy
    environment:
      # Ollama runs on the host; host.docker.internal reaches it from the container
      OLLAMA_HOST: http://host.docker.internal:11434
      MODEL_NAME: qwen2.5:3b
      # Toggle without editing this file:  $env:GUARDRAIL_ENABLED="true"  (PowerShell)
      GUARDRAIL_ENABLED: "${GUARDRAIL_ENABLED:-false}"
      GUARDRAIL_URL: http://guardrail:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux

  # Attack suite. Not started by `docker compose up`; run it with:
  #   docker compose run --rm redteam
  redteam:
    build:
      context: .
      dockerfile: redteam/Dockerfile
    profiles: ["redteam"]
    depends_on:
      chatbot:
        condition: service_healthy
    environment:
      TARGET_URL: http://chatbot:8000
      MAX_ASR: "0.20"
      REPORT_DIR: /srv/reports
    volumes:
      - ./reports:/srv/reports